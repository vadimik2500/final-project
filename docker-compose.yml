version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/postgresql/data

  api-service:
    build: ./api-service
    environment:
      DB_HOST: db
      DB_NAME: app
      DB_USER: postgres
      DB_PASS: 1234
    depends_on:
      - db

  gateway-service:
    build: ./gateway-service
    ports:
      - "8080:80"
    depends_on:
      - api-service

volumes:
  db_data:
